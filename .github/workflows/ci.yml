name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: test
        run: go test ./...
