name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no notes under ## [${GITHUB_REF_NAME#v}]" >&2
            exit 1
          fi
      # Until the tap token exists (#104), a release publishes to GitHub Releases only (#146).
      # GoReleaser is pinned to the version `make release-dry-run` was last checked with: one that
      # still writes the Homebrew formula from `brews`, which 2.10 and later deprecate in favour of
      # casks. The formula stays (docs/contracts.md A16), so a newer version is taken only once a
      # dry run shows it still writes it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.18.3"
          args: >-
            release --clean --release-notes ${{ runner.temp }}/release-notes.md
            ${{ secrets.HOMEBREW_TAP_TOKEN == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with contents write on weslo/homebrew-tap only, which the
          # maintainer creates as docs/manual-gates/M4.md, "Tap token", says; with no secret, the
          # release skips Homebrew.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
